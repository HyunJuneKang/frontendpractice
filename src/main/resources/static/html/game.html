<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InGame...</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/game-layout.css">
    <link rel="stylesheet" href="../css/game.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
<div id="game-lobby" class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo">
            로고이미지
        </div>

        <nav class="sidebar-menu">
            <section class="sidebar-section" data-category="shop">
                <h3 class="sidebar-section-title">상점
                    <button type="button" class="sidebar-section-title-button-hide" data-container="shop-button-container">👁</button>
                </h3>
                <div class="sidebar-button-container" id="shop-button-container">
                    <button type="button" class="sidebar-button" data-target="shop-section">💰상점</button>
                    <button type="button" class="sidebar-button" data-target="inventory-section">💼인벤토리</button>
                </div>
            </section>

            <section class="sidebar-section" data-category="combat">
                <h3 class="sidebar-section-title">전투
                    <button type="button" class="sidebar-section-title-button-hide" data-container="combat-button-container">👁</button>
                </h3>
                <div class="sidebar-button-container" id="combat-button-container">
                    <button type="button" class="sidebar-button" data-target="combat-section">⚔️전투레벨</button>
                    <button type="button" class="sidebar-button" data-target="combat-section">🗡️공격</button>
                    <button type="button" class="sidebar-button" data-target="combat-section">💪힘</button>
                    <button type="button" class="sidebar-button" data-target="combat-section">🛡️방어</button>
                    <button type="button" class="sidebar-button" data-target="combat-section">❤️체력</button>
                </div>
            </section>

            <section class="sidebar-section" data-category="non-combat">
                <h3 class="sidebar-section-title">비전투
                    <button type="button" class="sidebar-section-title-button-hide" data-container="non-combat-button-container">👁</button>
                </h3>
                <div class="sidebar-button-container" id="non-combat-button-container">
                    <button type="button" class="sidebar-button" data-target="woodcutting-section">🌳벌목</button>
                    <button type="button" class="sidebar-button" data-target="fishing-section">🐟낚시</button>
                    <button type="button" class="sidebar-button" data-target="campfire-section">🔥캠프파이어</button>
                    <button type="button" class="sidebar-button" data-target="cooking-section">🍳요리</button>
                    <button type="button" class="sidebar-button" data-target="mining-section">⛏️채광</button>
                </div>
            </section>
        </nav>
    </aside>
    <header class="main-header">
        게임화면 헤더
    </header>
    <main class="main">
        <section id="shop-section" class="content-section hidden">
            <div class="active-card-container"></div>
        </section>
        <section id="inventory-section" class="content-section hidden">
            <div class="active-card-container"></div>
        </section>
        <section id="combat-section" class="content-section hidden">
            <div id="combat-section-place-button-container">
                <button type="button" class="combat-section-place-button" data-place="1">전투지역</button>
                <button type="button" class="combat-section-place-button" data-place="2">공사중..</button>
                <button type="button" class="combat-section-place-button" data-place="3">공사중..</button>
                <button type="button" class="combat-section-place-button" data-place="4">공사중..</button>
            </div>
            <div id="combat-section-place-detail-button-container" class="hidden">

            </div>
            <div id="combat-section-battle-info-container">
                <div id="combat-section-battle-character-info-container" class="entity-info-container">
                    <!--체력과 공격 주기에 대한 정보 양옆으로 나열되어있으며(flex) , 체력과 공격주기는 각 캐릭터의 db에서 계산한 후 렌더링-->
                    <div class="combat-info-header" id="my-character">
                        <div class="combat-info-health-card">
                            <div class="combat-info-health-bar"></div>
                            <span>❤️</span>
                            <span class="health-value"></span>
                        </div>
                        <div class="combat-info-attack-duration-card">
                            <div class="combat-info-attack-duration-bar"></div>
                            <span>공격 간격:</span>
                            <span class="attack-duration-value"></span>
                        </div>
                    </div>
                    <div id="combat-info-body">
                        <div id="combat-info-left-info" class="combat-info">
                            <!--펫에 대한 정보, 버튼누르면 인벤토리에 있는 펫 js로 option 땡겨와라 장착 가능 class="combat-info-select-pet"-->
                            <div id="combat-info-pet-container" class="combat-info-card">
                                <div class="combat-info-card-header">펫</div>
                                <select id="combat-info-pet" class="combat-info-card-body" name="펫 선택">
                                    <option value="">-- 선택하세요 --</option>
                                </select>
                            </div>
                            <!--스킬에 대한 정보-->
                            <!--가지고 있는 스킬 리스트를 button으로 만들어 넣음 class="combat-info-select-skill"-->
                            <div id="combat-info-select-skill-container" class="combat-info-card">
                                <div class="combat-info-card-header">스킬</div>
                                <div id="combat-info-skill-body"></div>
                            </div>
                            <!--장비에 대한 정보-->
                            <!--장비가 이미 비어있는걸로 존재하며 클릭시 right-info 에 인벤토리가 보여줘 장착 가능-->
                            <!--rendering 할때 장비에 비어있는 이미지 또는 장착할때 입은 이미지를 렌더링 해서 보여줘야함-->
                            <div id="combat-info-select-equipment-card" class="combat-info-card">
                                <div class="combat-info-card-header">장비</div>
                                <div id="combat-info-equipment-column-container-container">
                                    <div class="combat-info-equipment-column-container">
                                        <button type="button" class="combat-info-select-equipment" data-category="headgear"></button>
                                        <button type="button" class="combat-info-select-equipment" data-category="armor"></button>
                                        <button type="button" class="combat-info-select-equipment" data-category="pants"></button>
                                        <button type="button" class="combat-info-select-equipment" data-category="shoes"></button>
                                    </div>
                                    <div class="combat-info-equipment-column-container">
                                        <button type="button" class="combat-info-select-equipment" data-category="clock"></button>
                                        <button type="button" class="combat-info-select-equipment" data-category="ring"></button>
                                        <button type="button" class="combat-info-select-equipment" data-category="necklace"></button>
                                    </div>
                                    <div class="combat-info-equipment-column-container">
                                        <button type="button" class="combat-info-select-equipment" data-category="shoulder"></button>
                                        <button type="button" class="combat-info-select-equipment" data-category="weapon"></button>
                                        <button type="button" class="combat-info-select-equipment" data-category="shield"></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="combat-info-right-info">
                            <!--능력치에 대한 정보-->
                            <!--js로 능력치에 대한 값을 뿌려준다.-->
                            <div id="combat-info-status-card" class="combat-info-card">
                                <div class="combat-info-card-header">능력치</div>
                                <div id="combat-info-status-body">
                                    <!--js로 능력치 뿌리기-->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="combat-section-battle-enemy-info-container" class="entity-info-container">
                    <div class="combat-info-header" id="enemy-character">
                        <div class="combat-info-health-card">
                            <div class="combat-info-health-bar"></div>
                            <span>❤️</span>
                            <span class="health-value"></span>
                        </div>
                        <div class="combat-info-attack-duration-card">
                            <div class="combat-info-attack-duration-bar"></div>
                            <span>공격 간격:</span>
                            <span class="attack-duration-value"></span>
                        </div>
                    </div>
                    <div id="enemy-info-card">
                        <div id="enemy-card">
                            <div id="enemy-status">
                                <div>
                                    <span>⚔️최대공격력</span>
                                    <span id="enemy-max-damage"></span>
                                </div>
                                <div>
                                    <span>⚔️최소공격력</span>
                                    <span id="enemy-min-damage"></span>
                                </div>
                                <div>
                                    <span>🛡️방어력</span>
                                    <span id="enemy-defence"></span>
                                </div>
                            </div>
                            <div id="enemy-image">
                                <img alt="몹 이미지">
                            </div>
                        </div>
                    </div>
                </div>
                <div id="inventory-screen" class="hidden">
                    <!--구현중-->
                </div>
            </div>
        </section>
        <!--여러 활동에 대한 section , 활동에 대한 값을 저장한 db(현재는 임시데이터)에서 행위 자체를 가져와서 뿌려줌-->
        <section id="woodcutting-section" class="content-section">
            <div class="active-card-container"></div>
        </section>
        <section id="fishing-section" class="content-section hidden">
            <div class="active-card-container"></div>
        </section>
        <section id="campfire-section" class="content-section hidden">
            <div class="active-card-container"></div>
        </section>
        <section id="cooking-section" class="content-section hidden">
            <div class="active-card-container"></div>
        </section>
        <section id="mining-section" class="content-section hidden">
            <div class="active-card-container"></div>
        </section>
    </main>
    <footer class="footer">
        <p>footer</p>
        <p>&copy;2026 프론트엔드연습하기_shinhanDS강현준</p>
    </footer>
</div>
<script src="../js/data/game-data.js"></script>
<script src="../js/game.js"></script>
</body>
</html>
