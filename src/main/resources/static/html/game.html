<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InGame...</title>
</head>
<body>
<section id="game-lobby" class="screen">
    <aside class="game-sidebar">
        <section class="sidebar-header">
            <div class="sidebar-logo">로고이미지</div>
        </section>
        <nav class="sidebar-menu">
            <section class="sidebar-section" data-category="combat">
                <h3 class="sidebar-section-title">전투</h3>
                <button type="button" class="sidebar-button" data-target="combat-section">전투레벨</button>
                <button type="button" class="sidebar-button" data-target="combat-section">공격</button>
                <button type="button" class="sidebar-button" data-target="combat-section">힘</button>
                <button type="button" class="sidebar-button" data-target="combat-section">방어</button>
                <button type="button" class="sidebar-button" data-target="combat-section">체력</button>
            </section>
            <section class="sidebar-section" data-category="non-combat">
                <h3 class="sidebar-section-title">비전투</h3>
                <button type="button" class="sidebar-button" data-target="woodcutting-section">벌목</button>
                <button type="button" class="sidebar-button" data-target="fishing-section">낚시</button>
                <button type="button" class="sidebar-button" data-target="camping-section">캠프파이어</button>
                <button type="button" class="sidebar-button" data-target="cooking-section">요리</button>
                <button type="button" class="sidebar-button" data-target="mining-section">채광</button>
            </section>
        </nav>
    </aside>
    <header id="header-section">

    </header>
    <main class="game-main">
        <section id="combat-section" class="content-section">전투 화면</section>
        <section id="woodcutting-section" class="content-section">벌목 화면</section>
        <section id="fishing-section" class="content-section">낚시 화면</section>
        <section id="campfire-section" class="content-section">캠프파이어 화면</section>
        <section id="cooking-section" class="content-section">요리 화면</section>
        <section id="mining-section" class="content-section">채광 화면</section>
    </main>
</section>
<footer>
    <p>footer</p>
    <p>&copy;2026 프론트엔드연습하기_shinhanDS강현준</p>
</footer>
</body>
</html>
